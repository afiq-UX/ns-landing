  <!-- Figma 717:811, link card/1/coolicons:arrow-right-small-bulk-sharp —
       the one arrow the page uses, everywhere. It is only ever a CSS mask
       (.ico-arrow in variant.css), so this file is never painted as it
       stands: the fill below is read as alpha, and the colour comes from
       whatever currentColor is at the call site. That is what lets one
       file be black on the light sections and white on the dark ones.

       assets/icons/arrow-right.svg and arrow-right-white.svg are this
       same drawing at 24, filled black and white. Nothing references
       them any more. -->
